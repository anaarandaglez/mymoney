<script>
const $=s=>document.querySelector(s),KEY='mymoney.v1',uid=()=>Math.random().toString(36).slice(2,9),r2=x=>Math.round(x*100)/100;
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const eur=n=>{if(hide)return'•••• €';n=r2(n);let s=Math.abs(n).toFixed(2).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');if(s[1]==='00')s.pop();return(n<0?'−':'')+s.join(',')+' €'};

repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',chart:'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',eye:'<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',eyeoff:'<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>'};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
/* datos */
const kinds={cc:'Disponible',ah:'Ahorro',inv:'Inversión',ot:'Otros'},kindsL={ah:'Ahorro',cc:'Cuenta corriente (disponible)',inv:'Inversión',ot:'Otros'};
const defP=()=>[{id:'p1',n:'MSCI Emerging Markets EUR',a:20,d:2},{id:'p2',n:'S&P 500',a:50,d:2},{id:'p3',n:'Physical Gold USD',a:10,d:2},{id:'p4',n:'MSCI World USD',a:40,d:2}];
const def=()=>({accts:[{id:'cc',n:'Santander',k:'cc',b:0},{id:'ah',n:'Trade Republic (ahorro)',k:'ah',b:0}],tx:[],fx:[],
cats:{ing:['Ahorro','Venta (Vinted…)','Regalo','Trabajo puntual','Nómina','Otros'],gas:['Ahorro','Vivienda','Suscripciones','Transporte','Alimentación','Ocio','Restaurantes','Viajes','Regalos','Salud','Compras','Imprevisto','Otros'],tra:['Aportación a ahorro','Aportación a inversión','Retirada de ahorro','Retirada de inversión','Otros']},
proj:{a:[],r:[],e:[],ir:true,ie:true},invp:defP()});
const fix=o=>{const d=def();o.tx=o.tx||[];o.fx=o.fx||[];o.cats=Object.assign(d.cats,o.cats||{});o.proj=Object.assign(d.proj,o.proj||{});o.invp=Array.isArray(o.invp)?o.invp:d.invp;['ing','gas'].forEach(k=>{if(!o.cats[k].includes('Ahorro'))o.cats[k].unshift('Ahorro')});return o};
let S,warn=false;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S&&S.accts?fix(S):def();S.accts.forEach(a=>{if(a.id==='cc'&&a.n==='Cuenta corriente')a.n='Santander';if(a.id==='ah'&&a.n==='Ahorro')a.n='Trade Republic (ahorro)'});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){warn=true}};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0E1E5B';x.fillRect(0,0,180,180);x.fillStyle='#C9D863';x.font='bold 100px Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText('€',90,98);document.head.insertAdjacentHTML('beforeend','<link rel="apple-touch-icon" href="'+c.toDataURL('image/png')+'">')}catch(e){}
let hide=false;try{hide=localStorage.getItem('mymoney.hide')==='1'}catch(e){}
let tab='acc',mf='all',cur={};
const acc=id=>S.accts.find(a=>a.id===id),first=k=>(S.accts.find(a=>a.k===k)||{}).id||'';
const bal=(a,up)=>r2(a.b+S.tx.reduce((s,t)=>(!up||t.d<=up)?s+(t.to===a.id?t.a:0)-(t.from===a.id?t.a:0):s,0));
const sumK=(k,up)=>r2(S.accts.filter(a=>a.k===k).reduce((s,a)=>s+bal(a,up),0));
const dir=t=>{const f=acc(t.from),o=acc(t.to);return!f&&o?'in':f&&!o?'out':'tr'};
S.invp.forEach(p=>{if(typeof p.t!=='number')p.t=0;if(!Array.isArray(p.h))p.h=[]});
if(!S.invm){S.invm=1;S.accts.filter(a=>a.k==='inv').forEach(a=>{const v=bal(a);if(!v)return;const nm=a.n.toLowerCase(),p=S.invp.find(q=>{const x=q.n.toLowerCase();return x.includes(nm)||nm.includes(x)});if(p)p.t=r2(p.t+v);else S.invp.push({id:uid(),n:a.n,a:0,d:2,t:r2(v),h:[]})});save()}
function toast(s){const e=$('#toast');e.textContent=s;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2600)}
function modal(t,b,f){$('#sheet').innerHTML=`<div class="sh"><h3>${t}</h3><button class="x" onclick="closeM()" aria-label="Cerrar">${ic('x')}</button></div>${b}<div id="err" class="err"></div><div class="acts">${f}</div>`;$('#ov').style.display='flex'}
const closeM=()=>$('#ov').style.display='none';
function line(v,lab){const W=320,H=110,p=14,mx=Math.max(...v),mn=Math.min(...v),rg=(mx-mn)||1,X=i=>p+i*(W-2*p)/(v.length-1),Y=x=>H-p-(x-mn)/rg*(H-2*p-8);
return`<svg viewBox="0 0 ${W} ${H}" class="ch"><polyline fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" points="${v.map((x,i)=>X(i)+','+Y(x)).join(' ')}"/>${v.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x)}" r="4" fill="var(--rose)"/>`).join('')}<text x="${p}" y="${H-1}" class="tx">${lab[0]}</text><text x="${W-p}" y="${H-1}" text-anchor="end" class="tx">${lab[1]}</text></svg>`}
/* CUENTAS */
function vAcc(){const up=dnow(),B=k=>S.accts.filter(a=>a.k===k),sm=k=>r2(B(k).reduce((s,a)=>s+bal(a,up),0)),
P=[['Ahorrado',sm('ah'),'var(--lime)'],['Disponible',sm('cc'),'var(--rose)'],['Otros',sm('ot'),'#cfcfc4']].filter((p,i)=>i<2||p[1]),tot=r2(P.reduce((s,p)=>s+p[1],0)),base=P.reduce((s,p)=>s+Math.max(p[1],0),0),
kc={cc:'#f6dbe7',ah:'#e9efb4',inv:'#dcdff0',ot:'#ecebdc'},ki={cc:'wallet',ah:'bank',inv:'trend',ot:'layers'},
rw=a=>`<div class="row" onclick="acForm('${a.id}')"><div class="ico" style="background:${kc[a.k]}">${ic(ki[a.k],18)}</div><div><b>${esc(a.n)}</b>${a.s?`<small>${esc(a.s)}</small>`:''}</div><span>${eur(bal(a,up))}</span></div>`,
grp=(t,k)=>{const L=B(k);return L.length?`<section class="card"><div class="sh"><h3>${t}</h3><b>${eur(sm(k))}</b></div>${L.map(rw).join('')}</section>`:''};
return(S.seen?'':`<div class="tip" onclick="acForm(first('cc'))"><b>Empieza aquí.</b> Toca una cuenta para poner su saldo actual.</div>`)+(pendInv().length?bnr():'')+vSum()+`<div class="hero"><div class="l">Patrimonio en cuentas y ahorros</div><div class="big ${tot<0?'neg':''}">${eur(tot)}</div></div>
<div class="card"><div class="flow">${P.map(p=>`<i style="width:${base?Math.max(p[1],0)/base*100:0}%;background:${p[2]}"></i>`).join('')}</div><div class="leg3">${P.map(p=>`<div><span><u style="background:${p[2]}"></u>${p[0]}</span><b>${eur(p[1])}</b></div>`).join('')}</div></div>`+
grp('Ahorro','ah')+grp('Disponible','cc')+grp('Otros','ot')+`<p class="mut">Toca una cuenta para cambiar su nombre o su saldo. Cambiar el saldo no crea ningún movimiento. Las inversiones están aparte, en su propio apartado.</p><button class="b p w100" onclick="acForm()">${ic('plus',18)} Añadir cuenta</button>`}
function acForm(id,fk){const a=acc(id),up=dnow(),v=a||{n:'',k:fk||'ah',s:'',b:0},fl=(l,h)=>`<label>${l}${h}</label>`;cur={ac:id||'',k:v.k};
modal(a?'Editar cuenta':'Nueva cuenta',fl('Nombre',`<input id="c_n" value="${esc(v.n)}">`)+(v.k==='inv'?'':fl('Tipo',`<select id="c_k">${Object.entries(kindsL).filter(([k])=>k!=='inv').map(([k,l])=>`<option value="${k}" ${v.k===k?'selected':''}>${l}</option>`).join('')}</select>`))+fl('Detalle (opcional, por ejemplo ETF)',`<input id="c_s" value="${esc(v.s||'')}">`)+fl(v.k==='inv'?'Valor actual invertido (€)':'Saldo actual (€)',`<input id="c_b" inputmode="decimal" value="${String(a?bal(a,up):0).replace('.',',')}">`),
`<button class="b p" onclick="acSave()">Guardar</button>${a?`<button class="b d" onclick="acDel()">${ic('trash',18)} Eliminar</button>`:''}`)}
function acSave(){const n=$('#c_n').value.trim(),b=parse($('#c_b').value);if(!n)return $('#err').textContent='Añade un nombre.';if(isNaN(b))return $('#err').textContent='El saldo no es válido.';
const o=acc(cur.ac),up=dnow(),kk=$('#c_k')?$('#c_k').value:cur.k;if(o){o.b=r2(o.b+b-bal(o,up));Object.assign(o,{n,k:kk,s:$('#c_s').value.trim()})}else S.accts.push({id:uid(),n,k:kk,s:$('#c_s').value.trim(),b:r2(b)});S.seen=1;save();closeM();render()}
function acDel(){const n=S.tx.filter(t=>t.from===cur.ac||t.to===cur.ac).length;if(confirm('¿Eliminar esta cuenta?'+(n?' También se eliminarán sus '+n+' movimientos y los demás saldos pueden cambiar.':''))){S.tx=S.tx.filter(t=>t.from!==cur.ac&&t.to!==cur.ac);S.accts=S.accts.filter(a=>a.id!==cur.ac);save();closeM();render()}}
const mstat=k=>{let i=0,o=0,a=0;S.tx.forEach(t=>{if(t.d.slice(0,7)!==k)return;const f=acc(t.from),to=acc(t.to);if((f&&f.k==='inv')||(to&&to.k==='inv'))return;
if(!f&&to){if(to.k==='ah'&&t.c==='Ahorro')a+=t.a;else i+=t.a}else if(f&&!to){if(t.c!=='Ahorro')o+=t.a}else if(f&&to){if(to.k==='ah'&&f.k!=='ah')a+=t.a;else if(f.k==='ah'&&to.k!=='ah')a-=t.a}});return{i:r2(i),o:r2(o),a:r2(a)}};
function vSum(){const s=mstat(curM),ip=r2(S.invp.reduce((x,p)=>x+p.a,0)),T=(l,v,c,cl)=>`<div><span><u style="background:${c}"></u>${l}</span><b class="${cl||''}">${eur(v)}</b></div>`;
return`<div class="hero" style="padding-bottom:0"><div class="l">Resumen del mes</div><div class="big" style="font-size:34px;text-transform:capitalize">${ml(curM)}</div></div><div class="hl"><div><span>Has ahorrado</span><b>${eur(s.a)}</b></div><div><span>Has gastado</span><b>${eur(s.o)}</b></div></div><div class="sum">${T('Ingresos',s.i,'var(--lime)','g')}${T('Salidas',s.o,'var(--rose)')}${T('Ahorro',s.a,'#9fb21d')}${T('Inversión prevista',ip,'var(--ink)')}</div>`}
/* MOVIMIENTOS */
const LB={in:'Entrada',out:'Salida',tr:'Traspaso'},IC={in:['inn','#e9efb4'],out:['out','#f6dbe7'],tr:['swap','#dcdff0']};
const who=t=>{const f=acc(t.from),o=acc(t.to),k=dir(t);return k==='in'?'a '+o.n:k==='out'?'de '+f.n:f.n+' → '+o.n};
const row=t=>{const k=dir(t);return`<div class="row" onclick="movOpts('${t.id}')"><div class="ico" style="background:${IC[k][1]}">${ic(IC[k][0],18)}</div><div><b>${esc(t.n||t.c||LB[k])}</b><small>${t.d.slice(8)}/${t.d.slice(5,7)}, ${esc(t.c&&t.n?t.c+', ':'')}${esc(who(t))}</small></div><span class="${k==='in'?'g':k==='tr'?'mut2':''}">${k==='in'?'+':k==='out'?'−':''}${eur(t.a)}</span></div>`};
function vMov(){let T=S.tx.filter(t=>mf==='all'||dir(t)===mf).sort((a,b)=>b.d.localeCompare(a.d));const G=[];T.forEach(t=>{const k=t.d.slice(0,7);if(!G.length||G[G.length-1].k!==k)G.push({k,r:[]});G[G.length-1].r.push(t)});
return`<button class="b p w100" style="margin-top:6px" onclick="openTx()">${ic('plus',18)} Nuevo movimiento</button>
<div class="seg">${[['all','Todos'],['in','Entradas'],['out','Salidas'],['tr','Traspasos']].map(([k,l])=>`<button class="${mf===k?'on':''}" onclick="mf='${k}';render()">${l}</button>`).join('')}</div>`+
(G.length?G.map(g=>`<h4 class="mh">${ml(g.k)}</h4><section class="card" style="margin-top:6px">${g.r.map(row).join('')}</section>`).join(''):'<p class="empty">Aún no hay movimientos. Toca «Nuevo movimiento» para añadir el primero.</p>')+
`<p class="mut">Toca un movimiento para editarlo o eliminarlo. Un traspaso mueve dinero entre tus cuentas y no cuenta como ingreso ni como gasto.</p>`}
const defs=k=>k==='in'?{from:'',to:first('cc')}:k==='out'?{from:first('cc'),to:''}:{from:first('cc'),to:first('ah')};
function openTx(id){const o=id&&S.tx.find(q=>q.id===id);cur={id:id||''};const x=o?{...o}:{d:dnow(),a:'',n:'',c:''};const k=o?dir(o):'in';if(!o)Object.assign(x,defs(k));form(x,k)}
function fsw(k){const g=i=>$('#'+i).value;form({...defs(k),a:g('f_a'),d:g('f_d'),c:g('f_c'),n:g('f_n')},k)}
function form(x,k){cur.k=k;const sel=(i,v)=>`<select id="${i}">${S.accts.filter(a=>a.k!=='inv'||a.id===v).map(a=>`<option value="${a.id}" ${a.id===v?'selected':''}>${esc(a.n)}</option>`).join('')}</select>`,fl=(l,h)=>`<label>${l}${h}</label>`,L=S.cats[k==='in'?'ing':k==='out'?'gas':'tra'];
modal(cur.id?'Editar movimiento':'Nuevo movimiento',`<div class="seg">${['in','out','tr'].map(q=>`<button class="${q===k?'on':''}" onclick="fsw('${q}')">${LB[q]}</button>`).join('')}</div>`+
fl('Importe (€)',`<input id="f_a" inputmode="decimal" placeholder="0,00" value="${x.a===''?'':typeof x.a==='string'?esc(x.a):String(x.a).replace('.',',')}">`)+fl('Fecha',`<input id="f_d" type="date" value="${x.d}">`)+
(k!=='in'?fl(k==='tr'?'Cuenta de origen':'Sale de',sel('f_from',x.from)):'')+(k!=='out'?fl(k==='tr'?'Cuenta de destino':'Entra en',sel('f_to',x.to)):'')+
fl('Categoría',`<input id="f_c" list="dl" value="${esc(x.c)}"><datalist id="dl">${L.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`)+fl('Descripción (opcional)',`<input id="f_n" maxlength="60" value="${esc(x.n)}">`),
`<button class="b p" onclick="saveTx()">Guardar</button>${cur.id?`<button class="b d" onclick="delTx()">${ic('trash',18)} Eliminar</button>`:''}`)}
function saveTx(){const g=i=>{const e=$('#'+i);return e?e.value.trim():''},er=s=>{$('#err').textContent=s},k=cur.k,a=parse(g('f_a')),d=g('f_d');
if(!(a>0))return er('Introduce un importe mayor que 0.');if(!/^\d{4}-\d\d-\d\d$/.test(d)||isNaN(new Date(d)))return er('La fecha no es válida.');
const old=S.tx.find(q=>q.id===cur.id)||{},o={...old,id:cur.id||uid(),t:k==='in'?'ing':k==='out'?'gas':'tra',a:r2(a),d,c:g('f_c'),n:g('f_n'),from:k==='in'?'':g('f_from'),to:k==='out'?'':g('f_to')};
if((k!=='in'&&!o.from)||(k!=='out'&&!o.to))return er('Elige la cuenta.');if(o.from&&o.from===o.to)return er('Origen y destino deben ser cuentas distintas.');
const L=S.cats[k==='in'?'ing':k==='out'?'gas':'tra'];if(o.c&&!L.includes(o.c))L.push(o.c);
const i=S.tx.findIndex(q=>q.id===o.id);i<0?S.tx.push(o):S.tx[i]=o;save();closeM();render()}
function movOpts(id){const t=S.tx.find(q=>q.id===id);if(!t)return;const k=dir(t);cur={id};modal(esc(t.n||t.c||LB[k]),`<p class="mut">${eur(t.a)}, ${t.d.slice(8)}/${t.d.slice(5,7)}/${t.d.slice(0,4)}, ${esc(who(t))}</p>`,`<button class="b p" onclick="openTx('${id}')">Editar</button><button class="b d" onclick="delTx()">${ic('trash',18)} Eliminar</button>`)}
function delTx(){const t=S.tx.find(q=>q.id===cur.id);if(t&&confirm('¿Eliminar este movimiento de '+eur(t.a)+'? No se puede deshacer.')){S.tx=S.tx.filter(q=>q.id!==t.id);save();closeM();render()}}
/* gastos fijos (plantillas) */
function fxList(){modal('Gastos fijos',`<p class="mut">Plantillas de pagos recurrentes. «Cargar este mes» los añade como salidas de tu cuenta disponible y luego puedes editarlos en Movimientos.</p>`+(S.fx.length?S.fx.map(f=>`<div class="row" onclick="fxForm('${f.id}')"><div><b>${esc(f.n)}</b><small>${{1:'Mensual',3:'Trimestral',6:'Semestral',12:'Anual'}[f.p]}, día ${f.day}</small></div><span>${eur(f.a)}</span></div>`).join(''):'<p class="empty">Aún no tienes plantillas.</p>'),`<button class="b p" onclick="fxForm()">${ic('plus',18)} Nueva</button><button class="b" onclick="loadFx()">${ic('repeat',18)} Cargar este mes</button>`)}
function fxForm(id){const f=S.fx.find(q=>q.id===id)||{n:'',a:'',p:1,m:+curM.slice(5),day:1,c:'Suscripciones'};cur={fx:id||''};const fl=(l,h)=>`<label>${l}${h}</label>`,op=(arr,v)=>arr.map(([k,l])=>`<option value="${k}" ${+k===+v?'selected':''}>${l}</option>`).join('');
modal(id?'Editar gasto fijo':'Nuevo gasto fijo',fl('Nombre',`<input id="x_n" value="${esc(f.n)}">`)+fl('Importe (€)',`<input id="x_a" inputmode="decimal" value="${f.a===''?'':String(f.a).replace('.',',')}">`)+fl('Periodicidad',`<select id="x_p">${op([[1,'Mensual'],[3,'Trimestral'],[6,'Semestral'],[12,'Anual']],f.p)}</select>`)+fl('Mes del primer pago (si no es mensual)',`<select id="x_m">${op(MES.map((l,i)=>[i+1,l]),f.m)}</select>`)+fl('Día de pago (1-28)',`<input id="x_d" type="number" min="1" max="28" value="${f.day}">`)+fl('Categoría',`<input id="x_c" list="dl" value="${esc(f.c)}"><datalist id="dl">${S.cats.gas.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`),
`<button class="b p" onclick="fxSave()">Guardar</button>${id?`<button class="b d" onclick="fxDel()">${ic('trash',18)} Eliminar</button>`:''}<button class="b" onclick="fxList()">Volver</button>`)}
function fxSave(){const a=parse($('#x_a').value),n=$('#x_n').value.trim(),day=Math.round(+$('#x_d').value);if(!n)return $('#err').textContent='Añade un nombre.';if(!(a>0))return $('#err').textContent='Introduce un importe mayor que 0.';if(!(day>=1&&day<=28))return $('#err').textContent='El día debe estar entre 1 y 28.';
const f={id:cur.fx||uid(),n,a:r2(a),p:+$('#x_p').value,m:+$('#x_m').value,day,c:$('#x_c').value.trim()};if(f.c&&!S.cats.gas.includes(f.c))S.cats.gas.push(f.c);const i=S.fx.findIndex(q=>q.id===f.id);i<0?S.fx.push(f):S.fx[i]=f;save();fxList()}
function fxDel(){if(confirm('¿Eliminar esta plantilla? Los gastos ya cargados no se borran.')){S.fx=S.fx.filter(q=>q.id!==cur.fx);save();fxList()}}
function loadFx(){const mm=curM,mo=+mm.slice(5);let n=0;S.fx.forEach(f=>{if(!(f.p===1||(((mo-f.m)%f.p)+f.p)%f.p===0)||S.tx.some(t=>t.fid===f.id&&t.d.slice(0,7)===mm))return;const dd=Math.min(f.day,new Date(+mm.slice(0,4),mo,0).getDate());S.tx.push({id:uid(),t:'gas',fix:1,fid:f.id,n:f.n,a:f.a,c:f.c,d:mm+'-'+String(dd).padStart(2,'0'),from:first('cc'),to:'',note:''});n++});save();closeM();render();toast(n?n+' gastos fijos cargados':'No hay gastos fijos pendientes')}
/* INVERSIONES */
function vInv(){const tot=r2(S.invp.reduce((x,p)=>x+p.a,0)),iv=r2(S.invp.reduce((x,p)=>x+(p.t||0),0)),pend=pendInv();
return(pend.length?bnr():'')+`<div class="hero"><div class="l">Aportación mensual prevista</div><div class="big">${eur(tot)}</div><div class="l">Es una planificación: no descuenta nada de tus cuentas.</div></div>
<section class="card"><div class="sh"><h3>Aportación mensual</h3><b>Total ${eur(tot)}</b></div>${S.invp.length?S.invp.map(p=>`<div class="row" onclick="invForm('${p.id}')"><div class="ico" style="background:#dcdff0">${ic('chart',18)}</div><div><b>${esc(p.n)}</b><small>Día ${p.d} de cada mes</small></div><span>${eur(p.a)}</span></div>`).join(''):'<p class="empty">Aún no tienes inversiones.</p>'}<div class="acts"><button class="b p" onclick="invForm()">${ic('plus',18)} Añadir inversión</button></div></section>
<section class="card"><div class="sh"><h3>Dinero invertido acumulado</h3><b>Total ${eur(iv)}</b></div>${S.invp.map(p=>`<div class="row" onclick="invTot('${p.id}')"><div class="ico" style="background:#dcdff0">${ic('trend',18)}</div><div><b>${esc(p.n)}</b></div><span>${eur(p.t||0)}</span></div>`).join('')}<p class="mut">Es el dinero que has aportado, no el valor de mercado. Toca un activo para corregir su total. No forma parte del patrimonio de Cuentas.</p></section>`}
const pendInv=()=>{const dd=new Date().getDate();return S.invp.filter(p=>dd>=p.d&&!(p.h||[]).includes(curM))};
const bnr=()=>`<div class="tip" onclick="confInv()"><b>Aportaciones de inversión</b><br>¿Has hecho ya las de ${ml(curM)}? Toca para confirmarlas.</div>`;
function confInv(){const P=pendInv();if(!P.length)return toast('No hay aportaciones pendientes');modal('Aportaciones de '+ml(curM),'<p class="mut">¿Has hecho estas aportaciones? Cambia el importe si este mes ha sido distinto. No se descuenta nada de tus cuentas.</p>'+P.map(p=>`<label>${esc(p.n)} (día ${p.d})<input id="q_${p.id}" inputmode="decimal" value="${String(p.a).replace('.',',')}"></label>`).join(''),`<button class="b p" onclick="confGo()">Confirmar aportaciones</button><button class="b" onclick="closeM()">Ahora no</button>`)}
function confGo(){const V=[];for(const p of pendInv()){const a=parse($('#q_'+p.id).value);if(!(a>=0))return $('#err').textContent='Revisa los importes.';V.push([p,a])}V.forEach(([p,a])=>{p.t=r2((p.t||0)+a);p.h=(p.h||[]).concat(curM)});save();closeM();render();toast('Aportaciones confirmadas')}
function invTot(id){const p=S.invp.find(q=>q.id===id);cur={ip:id};modal('Corregir total invertido',`<label>${esc(p.n)}: total aportado (€)<input id="t_a" inputmode="decimal" value="${String(p.t||0).replace('.',',')}"></label>`,`<button class="b p" onclick="invTotSave()">Guardar</button>`)}
function invTotSave(){const a=parse($('#t_a').value);if(isNaN(a))return $('#err').textContent='Importe no válido.';S.invp.find(q=>q.id===cur.ip).t=r2(a);save();closeM();render()}
function invForm(id){const p=S.invp.find(q=>q.id===id)||{n:'',a:'',d:2},fl=(l,h)=>`<label>${l}${h}</label>`;cur={ip:id||''};
modal(id?'Editar inversión':'Nueva inversión',fl('Nombre del activo',`<input id="p_n" value="${esc(p.n)}">`)+fl('Aportación mensual (€)',`<input id="p_a" inputmode="decimal" value="${p.a===''?'':String(p.a).replace('.',',')}">`)+fl('Día de aportación (1-28)',`<input id="p_d" type="number" min="1" max="28" value="${p.d}">`),`<button class="b p" onclick="invSave()">Guardar</button>${id?`<button class="b d" onclick="invDel()">${ic('trash',18)} Eliminar</button>`:''}`)}
function invSave(){const n=$('#p_n').value.trim(),a=parse($('#p_a').value),d=Math.round(+$('#p_d').value);if(!n)return $('#err').textContent='Añade un nombre.';if(!(a>=0))return $('#err').textContent='Introduce un importe válido.';if(!(d>=1&&d<=28))return $('#err').textContent='El día debe estar entre 1 y 28.';const old=S.invp.find(q=>q.id===cur.ip)||{t:0,h:[]},p={...old,id:cur.ip||uid(),n,a:r2(a),d},i=S.invp.findIndex(q=>q.id===p.id);i<0?S.invp.push(p):S.invp[i]=p;save();closeM();render()}
function invDel(){if(confirm('¿Eliminar esta inversión? También se perderá su total invertido.')){S.invp=S.invp.filter(q=>q.id!==cur.ip);save();closeM();render()}}
/* PROYECCIÓN */
function vProj(){const P=S.proj,up=dnow(),s0=sumK('ah',up);
let s=s0;const R=[];
for(let i=0;i<6;i++){const mm=addM(curM,i),A=P.a[i]==null?0:P.a[i];s=r2(s+A);R.push({mm,A,s})}
const c=(k,i,val)=>`<input class="pc" inputmode="decimal" value="${P[k][i]==null?'':String(P[k][i]).replace('.',',')}" placeholder="${String(val).replace('.',',')}" onchange="setP('${k}',${i},this.value)">`;
return`<div class="hero"><div class="l">Mi ahorro actual</div><div class="big">${eur(s0)}</div><div class="l">En seis meses: <b class="g">${eur(R[5].s)}</b></div></div>
<section class="card">${line([s0,...R.map(r=>r.s)],['Hoy',MES[+R[5].mm.slice(5)-1]])}</section>
<section class="card"><label style="margin-top:0">Ahorrar lo mismo cada mes (€)</label><div class="acts" style="margin-top:4px"><input id="fa" inputmode="decimal" style="flex:1;margin:0" placeholder="370"><button class="b p" onclick="applyAll()">Aplicar</button></div></section>`+
R.map((r,i)=>`<section class="card"><div class="sh"><h3 style="text-transform:capitalize">${MES[+r.mm.slice(5)-1]} ${r.mm.slice(0,4)}</h3><b style="font-size:18px">${eur(r.s)}</b></div><label style="margin-top:0">Ahorro previsto (€)${c('a',i,r.A)}</label></section>`).join('')+
`<section class="card">
<p class="mut" style="margin:0">Parte de tu ahorro de hoy y suma solo lo que indicas cada mes, sin intereses, rentabilidad ni revalorizaciones. Si retiras dinero o recibes un ingreso extra, anótalo en Movimientos y tu ahorro actual se actualizará.</p></section>`}
function setP(k,i,v){const P=S.proj;if(v.trim()===''){P[k][i]=null}else{const n=parse(v);if(isNaN(n))return toast('Importe no válido');P[k][i]=n}save();render()}
function applyAll(){const n=parse($('#fa').value);if(isNaN(n))return toast('Introduce un importe válido');S.proj.a=[n,n,n,n,n,n];save();render()}
/* AJUSTES */
function settings(){const it=(i,l,f,c)=>`<div class="row" onclick="${f}"><div class="ico" style="background:#ecebdc;${c||''}">${ic(i,18)}</div><div><b>${l}</b></div></div>`;
modal('Ajustes',it('repeat','Gastos fijos recurrentes','fxList()')+it('down','Exportar movimientos (CSV)','expCSV()')+it('down','Crear copia de seguridad','expJSON()')+it('up','Importar copia de seguridad','impForm()')+it('trash','Borrar todos los datos','wipe()','color:var(--r)'),'')}
async function dl(name,text){try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data:text});return}}catch(e){}
modal('Copia de tus datos','<p class="mut">No se puede descargar desde aquí. Copia el texto y guárdalo en una nota o un archivo.</p><textarea id="ta" readonly>'+esc(text)+'</textarea>','<button class="b p" onclick="$(\'#ta\').select();document.execCommand(\'copy\');toast(\'Copiado\')">Copiar</button>')}
function expCSV(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',R=[['Fecha','Tipo','Descripción','Importe','Categoría','Origen','Destino']].concat(S.tx.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(t=>[t.d,LB[dir(t)],t.n,String(t.a).replace('.',','),t.c,(acc(t.from)||{}).n||'',(acc(t.to)||{}).n||'']));dl('my-money-movimientos.csv','\ufeff'+R.map(r=>r.map(q).join(';')).join('\r\n'))}
const expJSON=()=>dl('my-money-copia-'+dnow()+'.json',JSON.stringify(S,null,1));
function impForm(){modal('Importar copia','<p class="mut">Pega el contenido de tu copia o elige el archivo. Sustituirá los datos actuales.</p><input type="file" accept=".json,application/json" onchange="const f=this.files[0];if(f)f.text().then(t=>$(\'#ta\').value=t)"><textarea id="ta"></textarea>','<button class="b p" onclick="impGo()">Importar</button>')}
function impGo(){try{const o=JSON.parse($('#ta').value);if(!Array.isArray(o.accts)||!Array.isArray(o.tx))throw 0;if(!confirm('Se sustituirán todos tus datos actuales. ¿Continuar?'))return;S=fix(o);save();closeM();render();toast('Copia importada')}catch(e){$('#err').textContent='El texto no es una copia válida.'}}
function wipe(){if(confirm('¿Borrar TODOS tus datos?')&&confirm('Última confirmación: no se puede deshacer.')){S=def();save();closeM();render()}}
/* navegación */
const TABS=[['acc','Cuentas','wallet',vAcc],['mov','Movimientos','swap',vMov],['inv','Inversiones','chart',vInv],['proj','Proyección','trend',vProj]];
function render(){const t=TABS.find(x=>x[0]===tab);$('#ht').textContent=t[1];$('#eb').innerHTML=ic(hide?'eyeoff':'eye',24);document.body.classList.toggle('hide-on',hide);$('#app').innerHTML='<div class="w">'+(warn?'<div class="warn">Este navegador no permite guardar datos. Exporta copias con frecuencia.</div>':'')+t[3]()+'</div>';
$('#nv').innerHTML=TABS.map(x=>`<button class="${x[0]===tab?'on':''}" onclick="go('${x[0]}')"><span class="pill">${ic(x[2],22)}${x[0]==='inv'&&pendInv().length?'<i class="dot"></i>':''}</span>${x[1]}</button>`).join('')}
const go=t=>{tab=t;render();$('#app').scrollTop=0};
function toggleHide(){hide=!hide;try{localStorage.setItem('mymoney.hide',hide?'1':'0')}catch(e){}render()}
$('#gb').innerHTML=ic('cog',24);render();if(pendInv().length)setTimeout(confInv,600);
</script></body></html>

</body></html>
