return(pend.length?bnr():'')+`<div class="hero"><div class="l">Aportación mensual prevista</div><div class="big">${eur(tot)}</div><div class="l">Es una planificación: no descuenta nada de tus cuentas.</div></div>

const pendInv=()=>{if(!isOn('inv'))return[];const dd=new Date().getDate();return S.invp.filter(p=>dd>=p.d&&!(p.h||[]).includes(curM))};

modal(id?'Editar inversión':'Nueva inversión',fl('Nombre del activo',`<input id="p_n" value="${esc(p.n)}">`)+fl('Aportación mensual (€)',`<input id="p_a" inputmode="decimal" value="${p.a===''?'':String(p.a).replace('.',',')}">`)+fl('Día de aportación (1-28)',`<input id="p_d" type="number" min="1" max="28" value="${p.d}">`),`<button class="b p" onclick="invSave()">Guardar</button>${id?`<button class="b d" onclick="invDel()">${ic('trash',18)} Eliminar</button>`:''}`)}

function settings(){const it=(i,l,f,c)=>`<div class="row" onclick="${f}"><div class="ico" style="background:var(--t-sand);${c||''}">${ic(i,18)}</div><div><b>${l}</b></div></div>`;

async function dl(name,text,mime){mime=mime||'application/json';
if(typeof claude!=='undefined'){try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data:text});return true}}catch(e){}}
try{const file=new File([text],name,{type:mime}),ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(ios&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return true}catch(e){if(e&&e.name==='AbortError')return false}}
const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Archivo descargado');return true}catch(e){}
modal('Copia de tus datos','<p class="mut">Este navegador no permite descargar el archivo. Copia el texto y guárdalo en una nota o en un archivo .json.</p><textarea id="ta" readonly>'+esc(text)+'</textarea>','<button class="b p" onclick="$(\'#ta\').select();document.execCommand(\'copy\');toast(\'Copiado\')">Copiar</button>');return false}
function expCSV(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',R=[['Fecha','Tipo','Descripción','Importe','Categoría','Origen','Destino']].concat(S.tx.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(t=>[t.d,LB[dir(t)],t.n,String(t.a).replace('.',','),t.c,(acc(t.from)||{}).n||'',(acc(t.to)||{}).n||'']));dl('my-money-movimientos.csv','﻿'+R.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv')}
const expJSON=()=>dl('my-money-copia-'+dnow()+'.json',JSON.stringify({app:'MyMoney',version:1,creada:new Date().toISOString(),prefs:{ocultar:hide},datos:S},null,1));
function validar(txt){let o;try{o=JSON.parse(txt)}catch(e){return{e:'El contenido no se puede leer: no es un archivo de copia de My Money.'}}
if(!o||typeof o!=='object'||Array.isArray(o))return{e:'El contenido no es una copia de My Money.'};
if(o.app&&o.app!=='MyMoney')return{e:'Este archivo no es una copia de My Money.'};
if(o.version>1)return{e:'Esta copia se creó con una versión más reciente de My Money y no se puede restaurar aquí.'};
const d=o.datos&&typeof o.datos==='object'?o.datos:o;
if(!Array.isArray(d.accts)||!Array.isArray(d.tx))return{e:'Faltan las cuentas o los movimientos: no parece una copia de My Money.'};
if(!d.accts.every(a=>a&&typeof a.id==='string'&&typeof a.n==='string'&&['cc','ah','inv','ot'].includes(a.k)&&Number.isFinite(a.b)))return{e:'Alguna cuenta de la copia no es válida.'};
const ids=new Set(d.accts.map(a=>a.id));
if(!d.tx.every(t=>t&&typeof t.id==='string'&&Number.isFinite(t.a)&&/^\d{4}-\d\d-\d\d$/.test(t.d)&&(!t.from||ids.has(t.from))&&(!t.to||ids.has(t.to))))return{e:'Algún movimiento de la copia no es válido.'};
if(d.invp!==undefined&&!(Array.isArray(d.invp)&&d.invp.every(p=>p&&typeof p.id==='string'&&typeof p.n==='string'&&Number.isFinite(p.a))))return{e:'Alguna inversión de la copia no es válida.'};
if(d.fx!==undefined&&!(Array.isArray(d.fx)&&d.fx.every(f=>f&&typeof f.id==='string'&&Number.isFinite(f.a))))return{e:'Algún gasto fijo de la copia no es válido.'};
let fecha='';try{if(o.creada){const f=new Date(o.creada);if(!isNaN(f))fecha=f.toLocaleDateString('es-ES')}}catch(e){}
return{d,prefs:o.prefs||{},fecha}}
function impForm(){modal('Restaurar copia de seguridad','<p class="mut">Elige el archivo de copia que descargaste, o pega su contenido. Al restaurar, tus datos actuales serán sustituidos por los de la copia.</p><input type="file" accept=".json,application/json,text/plain" onchange="impFile(this)"><textarea id="ta" placeholder="…o pega aquí el contenido de la copia" oninput="impCheck()"></textarea><div id="imp_s" class="mut"></div>','<button class="b p" onclick="impGo()">Restaurar</button>')}
function impFile(el){const f=el.files&&el.files[0];if(!f)return;f.text().then(t=>{$('#ta').value=t;impCheck()}).catch(()=>{$('#err').textContent='No se ha podido leer el archivo.'})}
function impCheck(){const t=$('#ta').value.trim(),st=$('#imp_s'),er=$('#err');er.textContent='';st.textContent='';if(!t)return null;const r=validar(t);if(r.e){er.textContent=r.e;return null}st.textContent='Copia válida: '+r.d.accts.length+' cuentas y '+r.d.tx.length+' movimientos'+(r.fecha?', creada el '+r.fecha:'')+'.';return r}
function impGo(){if(!$('#ta').value.trim()){$('#err').textContent='Elige primero un archivo de copia.';return}const r=impCheck();if(!r)return;

const keep=r.d.perfil?null:S.perfil;S=fix(r.d);if(keep)S.perfil=keep;if(typeof r.prefs.ocultar==='boolean'){hide=r.prefs.ocultar;try{localStorage.setItem(HKEY,hide?'1':'0')}catch(e){}}
normS();save();tab='acc';closeM();render();toast('Copia restaurada')}
function wipe(){if(confirm('¿Borrar TODOS tus datos de este navegador?')&&confirm('Última confirmación: no se puede deshacer. Si los necesitas, crea antes una copia de seguridad.')){try{localStorage.removeItem(KEY);localStorage.removeItem(OLDKEY);localStorage.removeItem(KEY+':corrupto')}catch(e){}S=def();normS();save();tab='acc';closeM();render()}}
